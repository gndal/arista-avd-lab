frr version 8.4.4
frr defaults traditional
hostname fw1
no ipv6 forwarding
!
! ---------------------------------------------------------------------------
! ADVERTISE THE DEFAULT ROUTE AND NOTHING ELSE. Single most important line
! in this file -- re-advertising a learned tenant prefix would loop back to
! its own originating AS (65103) and get dropped as an AS-path loop. Full
! rationale: docs/decisions.md's "fw1 advertises the default route only" ADR.
! ---------------------------------------------------------------------------
ip prefix-list DEFAULT_ONLY seq 5 permit 0.0.0.0/0
!
route-map ADVERTISE_DEFAULT_ONLY permit 10
 match ip address prefix-list DEFAULT_ONLY
!
router bgp 65500
 ! fw1 has no loopback, so without this FRR picks the highest interface
 ! address and the router-id changes if the addressing does.
 bgp router-id 10.255.0.254
 no bgp ebgp-requires-policy
 ! Both borderleaves advertise the same tenant prefixes -- without these two
 ! lines fw1 would pick one and lose the redundancy the second link exists
 ! to provide. multipath-relax is required since the paths share an AS but
 ! come from different peers.
 bgp bestpath as-path multipath-relax
 !
 ! Four sessions: one per VRF per borderleaf. There are no VRFs on this box --
 ! all four land in the same table, which is exactly what makes it an
 ! inter-VRF router. nftables decides what is actually allowed to cross.
 neighbor 10.255.10.0 remote-as 65103
 neighbor 10.255.10.0 description borderleaf1-VRF_RED
 neighbor 10.255.10.2 remote-as 65103
 neighbor 10.255.10.2 description borderleaf2-VRF_RED
 neighbor 10.255.20.0 remote-as 65103
 neighbor 10.255.20.0 description borderleaf1-VRF_BLUE
 neighbor 10.255.20.2 remote-as 65103
 neighbor 10.255.20.2 description borderleaf2-VRF_BLUE
 !
 address-family ipv4 unicast
  maximum-paths 4
  neighbor 10.255.10.0 default-originate
  neighbor 10.255.10.0 route-map ADVERTISE_DEFAULT_ONLY out
  neighbor 10.255.10.2 default-originate
  neighbor 10.255.10.2 route-map ADVERTISE_DEFAULT_ONLY out
  neighbor 10.255.20.0 default-originate
  neighbor 10.255.20.0 route-map ADVERTISE_DEFAULT_ONLY out
  neighbor 10.255.20.2 default-originate
  neighbor 10.255.20.2 route-map ADVERTISE_DEFAULT_ONLY out
 exit-address-family
!
line vty
!
