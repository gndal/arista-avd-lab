[defaults]
# Convenience default for ad-hoc CLI use (ansible-inventory, etc. during
# troubleshooting) -- every playbook invocation in .gitlab-ci.yml and the
# GitHub mirror's workflows passes -i explicitly and does not rely on this.
inventory = inventory/inventory.yml
# No collections_path override -- this repo reuses the arista.avd already
# installed in ~/avd-venv on the containerlab VM (pyavd 6.3.0 / anta 1.9.0)
# rather than vendoring a second copy into the checkout. See README.md.
host_key_checking = False
retry_files_enabled = False
# 8 EOS devices; Ansible's default of 5 would render and push in two
# sequential waves for no reason. Nothing here needs per-host serialisation
# (ordering that does matter is expressed by play structure, not forks).
# Note: forks helps the PUSH, not the render -- eos_designs does its work in
# a single-host delegated phase per fabric, which forks cannot parallelise
# (measured on the sibling arista-avd-dc-wan repo).
forks = 20

[inventory]
enable_plugins = yaml, auto
