aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_leaf1a_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.254.0.0/31
  metadata:
    peer: leaf1a
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_leaf1b_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.254.0.4/31
  metadata:
    peer: leaf1b
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_leaf2a_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.254.0.8/31
  metadata:
    peer: leaf2a
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_leaf2b_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.254.0.12/31
  metadata:
    peer: leaf2b
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_borderleaf1_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.254.0.16/31
  metadata:
    peer: borderleaf1
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_borderleaf2_Ethernet1
  shutdown: false
  mtu: 9214
  ip_address: 10.254.0.20/31
  metadata:
    peer: borderleaf2
    peer_interface: Ethernet1
    peer_type: l3leaf
  switchport:
    enabled: false
hostname: spine1
ip_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$MWcCxpFSH1YDvFuO$ntxuhDX4iDCt9DhM/z2hjN5vjsWpfSY0aOL2AFGx4rawtwbAGqOQkvH1aLZFLGUTRRUm6qrK7G3rQ8Lr54TVG/
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.1/32
management_api_http:
  enable_http: false
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.40.40.11/24
  type: oob
  gateway: 172.40.40.1
metadata:
  is_deployed: true
  platform: cEOSLab
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.255.0.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65100'
  router_id: 10.255.0.1
  maximum_paths:
    paths: 4
  bgp_defaults:
  - no bgp default ipv4-unicast
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.254.0.1
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf1a
    description: leaf1a_Ethernet1
  - ip_address: 10.254.0.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf1b
    description: leaf1b_Ethernet1
  - ip_address: 10.254.0.9
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf2a
    description: leaf2a_Ethernet1
  - ip_address: 10.254.0.13
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf2b
    description: leaf2b_Ethernet1
  - ip_address: 10.254.0.17
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: borderleaf1
    description: borderleaf1_Ethernet1
  - ip_address: 10.254.0.21
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: borderleaf2
    description: borderleaf2_Ethernet1
  - ip_address: 10.255.2.5
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: borderleaf1
    description: borderleaf1_Loopback0
  - ip_address: 10.255.2.6
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65103'
    metadata:
      peer: borderleaf2
    description: borderleaf2_Loopback0
  - ip_address: 10.255.2.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf1a
    description: leaf1a_Loopback0
  - ip_address: 10.255.2.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf1b
    description: leaf1b_Loopback0
  - ip_address: 10.255.2.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf2a
    description: leaf2a_Loopback0
  - ip_address: 10.255.2.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf2b
    description: leaf2b_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.40.40.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
