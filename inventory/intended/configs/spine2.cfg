!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$MWcCxpFSH1YDvFuO$ntxuhDX4iDCt9DhM/z2hjN5vjsWpfSY0aOL2AFGx4rawtwbAGqOQkvH1aLZFLGUTRRUm6qrK7G3rQ8Lr54TVG/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine2
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_leaf1a_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.2/31
!
interface Ethernet2
   description P2P_leaf1b_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.6/31
!
interface Ethernet3
   description P2P_leaf2a_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.10/31
!
interface Ethernet4
   description P2P_leaf2b_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.14/31
!
interface Ethernet5
   description P2P_borderleaf1_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.18/31
!
interface Ethernet6
   description P2P_borderleaf2_Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.22/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.0.2/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.40.40.12/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 172.40.40.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65100
   router-id 10.255.0.2
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.254.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.3 remote-as 65101
   neighbor 10.254.0.3 description leaf1a_Ethernet2
   neighbor 10.254.0.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.7 remote-as 65101
   neighbor 10.254.0.7 description leaf1b_Ethernet2
   neighbor 10.254.0.11 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.11 remote-as 65102
   neighbor 10.254.0.11 description leaf2a_Ethernet2
   neighbor 10.254.0.15 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.15 remote-as 65102
   neighbor 10.254.0.15 description leaf2b_Ethernet2
   neighbor 10.254.0.19 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.19 remote-as 65103
   neighbor 10.254.0.19 description borderleaf1_Ethernet2
   neighbor 10.254.0.23 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.23 remote-as 65103
   neighbor 10.254.0.23 description borderleaf2_Ethernet2
   neighbor 10.255.2.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.2.1 remote-as 65101
   neighbor 10.255.2.1 description leaf1a_Loopback0
   neighbor 10.255.2.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.2.2 remote-as 65101
   neighbor 10.255.2.2 description leaf1b_Loopback0
   neighbor 10.255.2.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.2.3 remote-as 65102
   neighbor 10.255.2.3 description leaf2a_Loopback0
   neighbor 10.255.2.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.2.4 remote-as 65102
   neighbor 10.255.2.4 description leaf2b_Loopback0
   neighbor 10.255.2.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.2.5 remote-as 65103
   neighbor 10.255.2.5 description borderleaf1_Loopback0
   neighbor 10.255.2.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.2.6 remote-as 65103
   neighbor 10.255.2.6 description borderleaf2_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
