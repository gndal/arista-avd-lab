# GENERATED by playbooks/render_lab.yml from inventory/site_registry.yml.
# Do not hand-edit. See docs/LLD.md and docs/decisions.md.

name: esidc

mgmt:
  network: clab-esidc
  ipv4-subnet: 172.40.40.0/24

topology:
  defaults:
    kind: ceos

  kinds:
    ceos:
      image: ceos:4.36
      startup-config: day0-ceos.cfg.tmpl
      enforce-startup-config: true
    linux:
      image: alpine:3.20

  nodes:
    spine1:
      labels: { role: spine }
      mgmt-ipv4: 172.40.40.11
      startup-delay: 0
    spine2:
      labels: { role: spine }
      mgmt-ipv4: 172.40.40.12
      startup-delay: 0
    leaf1a:
      labels: { role: leaf }
      mgmt-ipv4: 172.40.40.21
      startup-delay: 20
    leaf1b:
      labels: { role: leaf }
      mgmt-ipv4: 172.40.40.22
      startup-delay: 20
    leaf2a:
      labels: { role: leaf }
      mgmt-ipv4: 172.40.40.23
      startup-delay: 20
    leaf2b:
      labels: { role: leaf }
      mgmt-ipv4: 172.40.40.24
      startup-delay: 20
    borderleaf1:
      labels: { role: borderleaf }
      mgmt-ipv4: 172.40.40.31
      startup-delay: 40
    borderleaf2:
      labels: { role: borderleaf }
      mgmt-ipv4: 172.40.40.32
      startup-delay: 40

    # Test hosts: LACP-bonded across the rack's leaf pair.
    h1-red:
      kind: linux
      labels: { role: host, tenant: Tenant_Red }
      mgmt-ipv4: 172.40.40.41
      startup-delay: 60
      exec:
        # httpd lives in busybox-extras, not busybox, and must install
        # before the default route below moves off the mgmt bridge -- see
        # docs/troubleshooting.md.
        - apk add --no-cache iproute2 busybox-extras
        - ip link add bond0 type bond mode 802.3ad miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.10.110.101/24 dev bond0
        - ip route replace default via 10.10.110.1 dev bond0
        - sh -c 'echo h1-red > /tmp/index.html'
        - httpd -p 8080 -h /tmp
    h1-blue:
      kind: linux
      labels: { role: host, tenant: Tenant_Blue }
      mgmt-ipv4: 172.40.40.42
      startup-delay: 60
      exec:
        # httpd lives in busybox-extras, not busybox, and must install
        # before the default route below moves off the mgmt bridge -- see
        # docs/troubleshooting.md.
        - apk add --no-cache iproute2 busybox-extras
        - ip link add bond0 type bond mode 802.3ad miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.20.120.101/24 dev bond0
        - ip route replace default via 10.20.120.1 dev bond0
        - sh -c 'echo h1-blue > /tmp/index.html'
        - httpd -p 8080 -h /tmp
    h2-red:
      kind: linux
      labels: { role: host, tenant: Tenant_Red }
      mgmt-ipv4: 172.40.40.43
      startup-delay: 60
      exec:
        # httpd lives in busybox-extras, not busybox, and must install
        # before the default route below moves off the mgmt bridge -- see
        # docs/troubleshooting.md.
        - apk add --no-cache iproute2 busybox-extras
        - ip link add bond0 type bond mode 802.3ad miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.10.110.102/24 dev bond0
        - ip route replace default via 10.10.110.1 dev bond0
        - sh -c 'echo h2-red > /tmp/index.html'
        - httpd -p 8080 -h /tmp
    h2-blue:
      kind: linux
      labels: { role: host, tenant: Tenant_Blue }
      mgmt-ipv4: 172.40.40.44
      startup-delay: 60
      exec:
        # httpd lives in busybox-extras, not busybox, and must install
        # before the default route below moves off the mgmt bridge -- see
        # docs/troubleshooting.md.
        - apk add --no-cache iproute2 busybox-extras
        - ip link add bond0 type bond mode 802.3ad miimon 100
        - ip link set eth1 down
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link set eth1 up
        - ip link set eth2 up
        - ip addr add 10.20.120.102/24 dev bond0
        - ip route replace default via 10.20.120.1 dev bond0
        - sh -c 'echo h2-blue > /tmp/index.html'
        - httpd -p 8080 -h /tmp

    # Inter-VRF firewall: no VRFs of its own, nftables decides what crosses.
    fw1:
      kind: linux
      image: frr-firewall:1
      labels: { role: firewall }
      mgmt-ipv4: 172.40.40.51
      startup-delay: 60
      binds:
        - frr-firewall/frr.conf:/etc/frr/frr.conf:ro
        - frr-firewall/daemons:/etc/frr/daemons:ro
        - frr-firewall/nftables.conf:/etc/nftables.conf:ro
      exec:
        - ip link set eth1 up
        - ip link add link eth1 name eth1.3110 type vlan id 3110
        - ip addr add 10.255.10.1/31 dev eth1.3110
        - ip link set eth1.3110 up
        - ip link add link eth1 name eth1.3120 type vlan id 3120
        - ip addr add 10.255.20.1/31 dev eth1.3120
        - ip link set eth1.3120 up

  links:
    # Underlay: every l3leaf to both spines.
    - endpoints: ["leaf1a:eth1", "spine1:eth1"]
    - endpoints: ["leaf1a:eth2", "spine2:eth1"]
    - endpoints: ["leaf1b:eth1", "spine1:eth2"]
    - endpoints: ["leaf1b:eth2", "spine2:eth2"]
    - endpoints: ["leaf2a:eth1", "spine1:eth3"]
    - endpoints: ["leaf2a:eth2", "spine2:eth3"]
    - endpoints: ["leaf2b:eth1", "spine1:eth4"]
    - endpoints: ["leaf2b:eth2", "spine2:eth4"]
    - endpoints: ["borderleaf1:eth1", "spine1:eth5"]
    - endpoints: ["borderleaf1:eth2", "spine2:eth5"]
    - endpoints: ["borderleaf2:eth1", "spine1:eth6"]
    - endpoints: ["borderleaf2:eth2", "spine2:eth6"]

    # Test hosts: one link per leaf in the pair, bonded on the host side.
    - endpoints: ["leaf1a:eth3", "h1-red:eth1"]
    - endpoints: ["leaf1b:eth3", "h1-red:eth2"]
    - endpoints: ["leaf1a:eth4", "h1-blue:eth1"]
    - endpoints: ["leaf1b:eth4", "h1-blue:eth2"]
    - endpoints: ["leaf2a:eth3", "h2-red:eth1"]
    - endpoints: ["leaf2b:eth3", "h2-red:eth2"]
    - endpoints: ["leaf2a:eth4", "h2-blue:eth1"]
    - endpoints: ["leaf2b:eth4", "h2-blue:eth2"]

    # Firewall uplink(s) -- currently one (single-homed), see docs/decisions.md.
    - endpoints: ["borderleaf1:eth3", "fw1:eth1"]
