name: PR Checks
# Cloud-only, PR-triggered. Never runs on the self-hosted runner -- see
# .github/workflows/deploy.yml and docs/decisions.md for why that split is
# structural, not conditional. Mirrors .gitlab-ci.yml's lint/drift/render-and-diff.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install yamllint ansible-lint
      - run: yamllint .
      - run: ansible-lint

  drift:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook playbooks/render_lab.yml --check --diff

  render-and-diff:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook -i inventory/inventory.yml playbooks/build.yml
      - name: Fail if the committed render is stale
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          if ! git diff --quiet -- inventory/intended/; then
            echo "ERROR: re-rendering changed inventory/intended/ -- the committed render is stale."
            echo "Run: ansible-playbook -i inventory/inventory.yml playbooks/build.yml, then commit."
            git diff --stat -- inventory/intended/
            exit 1
          fi
      - name: Compute rendered config diff vs base branch
        id: diff
        run: |
          git diff "origin/${{ github.event.pull_request.base.ref }}" -- inventory/intended/configs/ > /tmp/render-diff.txt || true
          echo "----- rendered config diff -----"; cat /tmp/render-diff.txt; echo "---------------------------------"
          {
            echo 'body<<DIFF_EOF'
            echo '### Rendered config diff'
            echo
            if [ -s /tmp/render-diff.txt ]; then
              echo '```diff'; cat /tmp/render-diff.txt; echo '```'
            else
              echo 'No changes to device configuration.'
            fi
            echo 'DIFF_EOF'
          } >> "$GITHUB_OUTPUT"
      # Skipped for fork PRs: GITHUB_TOKEN is forced read-only on pull_request
      # events from forks regardless of the permissions: block above -- a
      # GitHub platform guarantee. The diff is always visible in the job log.
      - name: Post diff as PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.diff.outputs.body }}`
            });
