!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$MWcCxpFSH1YDvFuO$ntxuhDX4iDCt9DhM/z2hjN5vjsWpfSY0aOL2AFGx4rawtwbAGqOQkvH1aLZFLGUTRRUm6qrK7G3rQ8Lr54TVG/
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname borderleaf1
!
spanning-tree mode none
!
vlan 110
   name RED_App
!
vlan 120
   name BLUE_App
!
vrf instance MGMT
!
vrf instance VRF_BLUE
!
vrf instance VRF_RED
!
management api http-commands
   protocol https
   no protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_spine1_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.17/31
!
interface Ethernet2
   description P2P_spine2_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.254.0.19/31
!
interface Ethernet3
   no shutdown
   no switchport
!
interface Ethernet3.3110
   description fw1 VRF_RED transit
   no shutdown
   encapsulation dot1q vlan 3110
   vrf VRF_RED
   ip address 10.255.10.0/31
!
interface Ethernet3.3120
   description fw1 VRF_BLUE transit
   no shutdown
   encapsulation dot1q vlan 3120
   vrf VRF_BLUE
   ip address 10.255.20.0/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.255.2.5/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.255.3.5/32
!
interface Loopback100
   description DIAG_VRF_VRF_RED
   no shutdown
   vrf VRF_RED
   ip address 10.255.100.5/32
!
interface Loopback101
   description DIAG_VRF_VRF_BLUE
   no shutdown
   vrf VRF_BLUE
   ip address 10.255.101.5/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.40.40.31/24
!
interface Vlan110
   description RED_App
   no shutdown
   vrf VRF_RED
   ip address virtual 10.10.110.1/24
!
interface Vlan120
   description BLUE_App
   no shutdown
   vrf VRF_BLUE
   ip address virtual 10.20.120.1/24
!
interface Vxlan1
   description borderleaf1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
   vxlan vlan 120 vni 20120
   vxlan vrf VRF_BLUE vni 20
   vxlan vrf VRF_RED vni 10
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip address virtual source-nat vrf VRF_BLUE address 10.255.101.5
ip address virtual source-nat vrf VRF_RED address 10.255.100.5
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_BLUE
ip routing vrf VRF_RED
!
ip as-path access-list ASPATH-LOCAL-ONLY permit ^$ any
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.2.0/24 eq 32
   seq 20 permit 10.255.3.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 172.40.40.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-FW-IN permit 10
   set community 65103:100 additive
   set local-preference 80
!
route-map RM-FW-OUT permit 10
   match as-path ASPATH-LOCAL-ONLY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65103
   router-id 10.255.2.5
   no bgp default ipv4-unicast
   maximum-paths 4
   no bgp default ipv4-unicast
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.254.0.16 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.16 remote-as 65100
   neighbor 10.254.0.16 description spine1_Ethernet5
   neighbor 10.254.0.18 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.254.0.18 remote-as 65100
   neighbor 10.254.0.18 description spine2_Ethernet5
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 remote-as 65100
   neighbor 10.255.0.1 description spine1_Loopback0
   neighbor 10.255.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.2 remote-as 65100
   neighbor 10.255.0.2 description spine2_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 110
      rd 10.255.2.5:10110
      route-target both 10110:10110
      redistribute learned
   !
   vlan 120
      rd 10.255.2.5:20120
      route-target both 20120:20120
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf VRF_BLUE
      rd 10.255.2.5:20
      route-target import evpn 20:20
      route-target export evpn 20:20
      router-id 10.255.2.5
      neighbor 10.255.20.1 remote-as 65500
      neighbor 10.255.20.1 description fw1 (VRF_BLUE)
      neighbor 10.255.20.1 route-map RM-FW-IN in
      neighbor 10.255.20.1 route-map RM-FW-OUT out
      neighbor 10.255.20.1 maximum-routes 100 warning-only
      redistribute connected
      !
      address-family ipv4
         neighbor 10.255.20.1 activate
   !
   vrf VRF_RED
      rd 10.255.2.5:10
      route-target import evpn 10:10
      route-target export evpn 10:10
      router-id 10.255.2.5
      neighbor 10.255.10.1 remote-as 65500
      neighbor 10.255.10.1 description fw1 (VRF_RED)
      neighbor 10.255.10.1 route-map RM-FW-IN in
      neighbor 10.255.10.1 route-map RM-FW-OUT out
      neighbor 10.255.10.1 maximum-routes 100 warning-only
      redistribute connected
      !
      address-family ipv4
         neighbor 10.255.10.1 activate
!
end
