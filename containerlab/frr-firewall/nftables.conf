#!/usr/sbin/nft -f
flush ruleset

# Inter-VRF policy. This is the only path between VRF_RED and VRF_BLUE in the
# whole fabric, so whatever this ruleset drops is genuinely unreachable.
#
# ICMP is permitted between the two tenant subnets and nothing else is. That
# asymmetry is deliberate and is what makes the validation in
# playbooks/verify_dataplane.yml meaningful:
#
#   red -> blue  ping          MUST pass  (the firewall is routing between VRFs)
#   red -> blue  TCP 8080      MUST fail  (the firewall is actually filtering)
#   red -> red   TCP 8080      MUST pass  (control: the listener works, and
#                                          intra-VRF traffic never comes here)
#
# Without that third case a failing TCP test would be indistinguishable from a
# broken web server.
table inet filter {
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Return traffic for anything already permitted below. ICMP echo
        # replies are conntrack-established, so this is what makes the ping
        # test pass in both directions off a single rule pair.
        ct state established,related accept

        ip saddr 10.10.110.0/24 ip daddr 10.20.120.0/24 ip protocol icmp accept
        ip saddr 10.20.120.0/24 ip daddr 10.10.110.0/24 ip protocol icmp accept
    }
}
