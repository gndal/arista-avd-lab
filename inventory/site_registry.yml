---
# Single source of truth for node identity and cabling. Generates
# containerlab/topology.clab.yml and inventory/inventory.yml, and validates
# group_vars/FABRIC/fabric_variables.yml against it -- see
# playbooks/render_lab.yml and docs/decisions.md.
#
#   ansible-playbook playbooks/render_lab.yml                  write the files
#   ansible-playbook playbooks/render_lab.yml --check --diff    drift gate (CI)

lab:
  name: esidc
  fabric: FABRIC

mgmt:
  network: clab-esidc
  subnet: 172.40.40.0/24
  gateway: 172.40.40.1
  interface: Management0

images:
  ceos: ceos:4.36
  host: alpine:3.20
  firewall: frr-firewall:1

# Boot stagger by role (10-vCPU host) -- see docs/troubleshooting.md.
startup_delay_by_role:
  spine: 0
  leaf: 20
  borderleaf: 40
  host: 60
  firewall: 60

# `role` drives the ANTA tag in playbooks/validate.yml; `avd_group` is
# eos_designs' own grouping (leaf and borderleaf are both L3LEAFS). `uplinks`
# is ordered: index 0 = Ethernet1, index 1 = Ethernet2.
nodes:
  - name: spine1
    role: spine
    avd_group: SPINES
    id: 1
    mgmt: 172.40.40.11
  - name: spine2
    role: spine
    avd_group: SPINES
    id: 2
    mgmt: 172.40.40.12

  - name: leaf1a
    role: leaf
    avd_group: L3LEAFS
    node_group: RACK1
    id: 1
    mgmt: 172.40.40.21
    uplinks:
      - {peer: spine1, peer_port: Ethernet1}
      - {peer: spine2, peer_port: Ethernet1}
  - name: leaf1b
    role: leaf
    avd_group: L3LEAFS
    node_group: RACK1
    id: 2
    mgmt: 172.40.40.22
    uplinks:
      - {peer: spine1, peer_port: Ethernet2}
      - {peer: spine2, peer_port: Ethernet2}

  - name: leaf2a
    role: leaf
    avd_group: L3LEAFS
    node_group: RACK2
    id: 3
    mgmt: 172.40.40.23
    uplinks:
      - {peer: spine1, peer_port: Ethernet3}
      - {peer: spine2, peer_port: Ethernet3}
  - name: leaf2b
    role: leaf
    avd_group: L3LEAFS
    node_group: RACK2
    id: 4
    mgmt: 172.40.40.24
    uplinks:
      - {peer: spine1, peer_port: Ethernet4}
      - {peer: spine2, peer_port: Ethernet4}

  - name: borderleaf1
    role: borderleaf
    avd_group: L3LEAFS
    node_group: BORDER
    id: 5
    mgmt: 172.40.40.31
    uplinks:
      - {peer: spine1, peer_port: Ethernet5}
      - {peer: spine2, peer_port: Ethernet5}
  - name: borderleaf2
    role: borderleaf
    avd_group: L3LEAFS
    node_group: BORDER
    id: 6
    mgmt: 172.40.40.32
    uplinks:
      - {peer: spine1, peer_port: Ethernet6}
      - {peer: spine2, peer_port: Ethernet6}

# Test hosts, ESI-multihomed to both members of one leaf pair via 802.3ad.
# `attachments` ordered: index 0 = host's eth1, index 1 = eth2.
hosts:
  - name: h1-red
    mgmt: 172.40.40.41
    tenant: Tenant_Red
    vlan: 110
    ip: 10.10.110.101/24
    gateway: 10.10.110.1
    attachments:
      - {peer: leaf1a, peer_port: Ethernet3}
      - {peer: leaf1b, peer_port: Ethernet3}
  - name: h1-blue
    mgmt: 172.40.40.42
    tenant: Tenant_Blue
    vlan: 120
    ip: 10.20.120.101/24
    gateway: 10.20.120.1
    attachments:
      - {peer: leaf1a, peer_port: Ethernet4}
      - {peer: leaf1b, peer_port: Ethernet4}
  - name: h2-red
    mgmt: 172.40.40.43
    tenant: Tenant_Red
    vlan: 110
    ip: 10.10.110.102/24
    gateway: 10.10.110.1
    attachments:
      - {peer: leaf2a, peer_port: Ethernet3}
      - {peer: leaf2b, peer_port: Ethernet3}
  - name: h2-blue
    mgmt: 172.40.40.44
    tenant: Tenant_Blue
    vlan: 120
    ip: 10.20.120.102/24
    gateway: 10.20.120.1
    attachments:
      - {peer: leaf2a, peer_port: Ethernet4}
      - {peer: leaf2b, peer_port: Ethernet4}

# Inter-VRF firewall: no VRFs of its own, routed (not ESI-LAG) handoff,
# single-homed to borderleaf1 -- see docs/decisions.md.
firewall:
  name: fw1
  mgmt: 172.40.40.51
  asn: 65500
  uplinks:
    - peer: borderleaf1
      peer_port: Ethernet3
      subinterfaces:
        - {vrf: VRF_RED, tag: 3110, local: 10.255.10.1/31, remote: 10.255.10.0/31}
        - {vrf: VRF_BLUE, tag: 3120, local: 10.255.20.1/31, remote: 10.255.20.0/31}
