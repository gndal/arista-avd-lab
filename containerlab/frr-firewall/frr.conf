frr version 8.4.4
frr defaults traditional
hostname fw1
no ipv6 forwarding
!
! ---------------------------------------------------------------------------
! ADVERTISE THE DEFAULT ROUTE AND NOTHING ELSE.
!
! This is the single most important line in this file, and it is not just
! tidiness. fw1 learns both tenants' prefixes (that is how it routes between
! them), and every one of those prefixes was originated by a borderleaf in
! AS 65103. If fw1 re-advertised them, a VRF_BLUE prefix would arrive back at
! a borderleaf inside VRF_RED carrying AS-path "65500 65103" and be dropped as
! an AS-path loop -- the fabric's own ASN is in the path.
!
! Sending only 0.0.0.0/0 sidesteps that completely, and is sufficient: a red
! host follows the default out to fw1, fw1 has a real route to the blue
! subnet, and the return traffic follows blue's own default back the same way.
!
! Note that in FRR, `default-originate` injects 0.0.0.0/0 independently of the
! outbound route-map, so the two mechanisms compose exactly as wanted here:
! the route-map filters everything fw1 has *learned*, default-originate still
! generates the default.
! ---------------------------------------------------------------------------
ip prefix-list DEFAULT_ONLY seq 5 permit 0.0.0.0/0
!
route-map ADVERTISE_DEFAULT_ONLY permit 10
 match ip address prefix-list DEFAULT_ONLY
!
router bgp 65500
 ! fw1 has no loopback, so without this FRR picks the highest interface
 ! address and the router-id changes if the addressing does.
 bgp router-id 10.255.0.254
 no bgp ebgp-requires-policy
 !
 ! Two sessions: one per VRF, both to borderleaf1 -- fw1 is single-homed
 ! (see inventory/site_registry.yml's firewall block and docs/decisions.md
 ! for why: it is one non-redundant device, so a second borderleaf uplink
 ! would not have bought real redundancy). There are no VRFs on this box --
 ! both land in the same table, which is exactly what makes it an inter-VRF
 ! router. nftables decides what is actually allowed to cross.
 neighbor 10.255.10.0 remote-as 65103
 neighbor 10.255.10.0 description borderleaf1-VRF_RED
 neighbor 10.255.20.0 remote-as 65103
 neighbor 10.255.20.0 description borderleaf1-VRF_BLUE
 !
 address-family ipv4 unicast
  neighbor 10.255.10.0 default-originate
  neighbor 10.255.10.0 route-map ADVERTISE_DEFAULT_ONLY out
  neighbor 10.255.20.0 default-originate
  neighbor 10.255.20.0 route-map ADVERTISE_DEFAULT_ONLY out
 exit-address-family
!
line vty
!
